# Native Streamlit theming; no CSS selectors against Streamlit internals.
[theme]
base = "dark"
primaryColor = "#49d6c3"
backgroundColor = "#0b1220"
secondaryBackgroundColor = "#142137"
textColor = "#eef4fc"
font = "sans serif"
baseRadius = "0.65rem"
buttonRadius = "0.5rem"
borderColor = "#34465f"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#1c2d46"
headingFontSizes = ["2rem", "1.5rem", "1.15rem", "1rem", "0.9rem", "0.85rem"]

[theme.sidebar]
backgroundColor = "#0f1a2c"
secondaryBackgroundColor = "#1b2b43"
