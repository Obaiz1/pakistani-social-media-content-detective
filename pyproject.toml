[project]
name = "pakistani-social-media-content-detective"
version = "0.1.0"
description = "Evidence-based analytics: what YouTube content gets Pakistani clothing-brand audiences to engage?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "pandera>=0.20",
    "plotly>=5.24",
    "streamlit>=1.40",
    "scipy>=1.14",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
